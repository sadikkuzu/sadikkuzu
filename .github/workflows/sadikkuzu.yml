name: Update sadikkuzu README

on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    - cron: "0 1-23/2 * * *"

jobs:
  markscribe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Render README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/render_readme.py

      - uses: actions/upload-artifact@v7
        with:
          name: README.md
          path: README.md

      - uses: stefanzweifel/git-auto-commit-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: Update generated sadikkuzu readme
          commit_user_name: readme-scribe 🤖
          commit_user_email: sadikkuzu@hotmail.com
          commit_author: readme-scribe 🤖 <sadikkuzu@hotmail.com>
