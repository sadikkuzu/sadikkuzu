name: Update sadikkuzu README

on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    - cron: "0 1-23/2 * * *"

jobs:
  markscribe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install markscribe
        run: go install github.com/muesli/markscribe@master

      - name: Render README
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: markscribe -write README.md templates/sadikkuzu.tpl

      - uses: actions/upload-artifact@v7
        with:
          name: README.md
          path: README.md

      - uses: stefanzweifel/git-auto-commit-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: Update generated sadikkuzu readme
          commit_user_name: readme-scribe 🤖
          commit_user_email: sadikkuzu@hotmail.com
          commit_author: readme-scribe 🤖 <sadikkuzu@hotmail.com>
