name: Hello new day

on:
  schedule:
    - cron: "1 0 * * *"

jobs:
  midnight-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install markscribe
        run: go install github.com/muesli/markscribe@master

      - name: Render README
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: markscribe -write README.md templates/sadikkuzu.tpl

      - uses: actions/upload-artifact@v7
        with:
          name: README.md
          path: README.md

      - uses: stefanzweifel/git-auto-commit-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: Hello new day!
          commit_user_name: nights watch 🤖
          commit_user_email: sadikkuzu@hotmail.com
          commit_author: nights watch 🤖 <sadikkuzu@hotmail.com>
